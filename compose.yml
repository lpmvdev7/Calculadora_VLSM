services:
  frontend:
    build:
      context: './frontend'
      dockerfile: dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - '5173:80'
    depends_on:
      - backend
  
  backend:
    build:
      context: './backend'
      dockerfile: dockerfile
    ports:
      - '3000:3000'
    environment:
      - FRONTEND_URL=http://localhost:5173

  cli:
    build:
      context: './cli'
      dockerfile: dockerfile 
    depends_on:
      - backend
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
